name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      UV_CACHE_DIR: .uv-cache/release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.17

      - name: Build Windows application
        id: package
        shell: pwsh
        run: |
          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "manual-$env:GITHUB_RUN_NUMBER" }
          .\scripts\build_windows.ps1 -BuildLabel $label -SystemVcRuntime
          $archive = "dist\LoRA Factory_$label-windows-x64.zip"
          Compress-Archive -LiteralPath "dist\windows-$label\LoRA Factory" -DestinationPath $archive
          $hashFile = "$archive.sha256"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath $hashFile -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "hash_file=$hashFile" >> $env:GITHUB_OUTPUT

      - name: Upload verified Windows package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: LoRA-Factory-Windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.hash_file }}
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "${{ steps.package.outputs.archive }}"
          $hashFile = "${{ steps.package.outputs.hash_file }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists; replacing its generated assets."
              gh release upload $tag $archive $hashFile --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
              gh release create $tag $archive $hashFile `
                  --repo $env:GITHUB_REPOSITORY `
                  --verify-tag `
                  --generate-notes `
                  --title "LoRA Factory $tag"
          }
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release publication failed for tag $tag."
          }
