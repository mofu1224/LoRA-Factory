version: 2
updates:
  # The separate GPU runtime-lock.txt follows the pinned sd-scripts checkout.
  # Upgrade its dependencies together with that compatibility profile.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      - "runtime-lock.txt"
    # Security update PRs have a separate limit; routine updates are batched at release.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
