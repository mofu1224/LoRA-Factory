name: Bug report
description: Report a reproducible LoRA Factory problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach source images, model files, tokens, credentials, or logs containing private paths.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [Real, Fake, Not sure]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the stage and exact UI actions, with private values removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only redacted doctor output or error text. Never include credentials.
